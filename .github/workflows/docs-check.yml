name: Documentation check

on:
# Temporarily disabled for automatic runs. Keep manual execution available.
  workflow_dispatch:

jobs:
  required-documents:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required documentation
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "CONTRIBUTING.md"
            "AGENTS.md"
            "docs/game-design-document.md"
            "docs/architecture.md"
            "docs/tech-stack-decision.md"
            "docs/meeting-notes/README.md"
            "design/README.md"
            ".github/ISSUE_TEMPLATE/bug_report.md"
            ".github/ISSUE_TEMPLATE/feature_request.md"
            ".github/PULL_REQUEST_TEMPLATE.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Required documentation file is missing: $file" >&2
              exit 1
            fi
          done

          echo "All required documentation files are present."
